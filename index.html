<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi IP</title>
<meta name="theme-color" content="#0a1220">
<meta name="description" content="Suite de herramientas de red: tu IP pública IPv4/IPv6 con geolocalización y mapa, prueba de velocidad, consulta de IP, WHOIS, ASN, DNS, correo, listas negras, subredes y más.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi IP">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0a1220;--panel:#111c33;--panel2:#152140;--line:rgba(255,255,255,.08);--text:#eef2ff;--muted:#93a0c8;--accent:#4fd1c5;--v4:#74c0fc;--v6:#b197fc;--ok:#51cf66;--warn:#ffd43b;--bad:#ff6b6b;}
[data-theme=light]{--bg:#f3f5fb;--panel:#ffffff;--panel2:#f7f9ff;--line:rgba(10,18,32,.1);--text:#0f172a;--muted:#5b6785;--accent:#0f9d8f;--v4:#1c64d8;--v6:#6d4ee0;--ok:#2f9e44;--warn:#c98a00;--bad:#d6336c;}
[data-theme=light] body{background:radial-gradient(circle at 15% -10%,#dfe7ff 0%,var(--bg) 55%);}
[data-theme=light] header{background:rgba(243,245,251,.9);}
[data-theme=light] .tool .ic{background:linear-gradient(135deg,#e6ecff,#f4f7ff);}
[data-theme=light] .pre,[data-theme=light] .metric canvas,[data-theme=light] .hist canvas{background:rgba(10,18,32,.05);}
[data-theme=light] .copy,[data-theme=light] .allbtn.sec{background:rgba(10,18,32,.06);}
[data-theme=light] .badge.b-mut{background:rgba(10,18,32,.08);}
[data-theme=light] #g-val{fill:#0f172a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
.card,.tool{animation:up .35s ease both;}
.tool:nth-child(n+2){animation-delay:calc(var(--i,0)*35ms);}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.searchbar{display:flex;gap:8px;}
.searchbar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font-size:15px;outline:none;}
.searchbar input:focus{border-color:var(--accent);}
.searchbar button{background:var(--accent);color:#04231d;border:none;border-radius:14px;padding:0 16px;font-weight:800;}
.widgets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.widget{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;}
.widget .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.widget .v{font-size:16px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(81,207,102,.6);animation:pulse 1.6s infinite;margin-right:5px;vertical-align:middle;}
.pulse.off{background:var(--bad);animation:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(81,207,102,.5)}70%{box-shadow:0 0 0 8px rgba(81,207,102,0)}100%{box-shadow:0 0 0 0 rgba(81,207,102,0)}}
.actions{display:flex;gap:8px;margin-top:10px;}
.actions .allbtn{margin-top:0;}
.hist canvas{width:100%;height:110px;display:block;border-radius:10px;background:rgba(0,0,0,.2);}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cmp .h{font-size:12px;font-weight:800;color:var(--accent);word-break:break-all;}
.cmp .c{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);word-break:break-word;}
.cmp .c.diff{color:var(--warn);}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
body{background:radial-gradient(circle at 15% -10%,#16244a 0%,var(--bg) 55%);min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:20;background:rgba(10,18,32,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;}
h1{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none;}
.hbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap;}
.hbtn.hidden{display:none;}
main{padding:14px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
.card h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card h2 .sub{text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent);}
.lead{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 10px;}
.ipbox{display:flex;align-items:center;gap:10px;margin-top:4px;}
.ipval{flex:1;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.2;}
.ipval.v4{color:var(--v4);} .ipval.v6{color:var(--v6);font-size:17px;}
.ipval.none{color:var(--muted);font-size:14px;font-weight:600;}
.copy{flex:none;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:700;}
.copy.ok{background:var(--accent);color:#04231d;border-color:transparent;}
.rows{display:flex;flex-direction:column;}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .k{width:118px;flex:none;font-size:12px;color:var(--muted);font-weight:600;}
.row .v{flex:1;font-size:14px;font-weight:600;word-break:break-word;font-variant-numeric:tabular-nums;}
.row .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;}
.row .copy{padding:6px 9px;font-size:11.5px;}
.tabs{display:flex;gap:6px;}
.tab{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);}
.tab.on{background:var(--accent);color:#04231d;border-color:transparent;}
.map{height:280px;border-radius:14px;overflow:hidden;background:#0d1730;border:1px solid var(--line);}
.leaflet-container{background:#0d1730;}
.status{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}
.status.err{color:#ff8787;}
.allbtn{width:100%;background:var(--accent);color:#04231d;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:14px;}
.allbtn.sec{background:rgba(255,255,255,.08);color:var(--text);}
.allbtn:disabled{opacity:.6;}
.allbtn.ok{background:var(--ok);}
.skeleton{height:18px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s infinite;}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
footer{text-align:center;color:var(--muted);font-size:11px;padding:14px 10px 0;line-height:1.5;}
/* Home grid */
.hero{display:flex;flex-direction:column;gap:6px;}
.hero .big{font-size:26px;font-weight:800;color:var(--v4);font-variant-numeric:tabular-nums;word-break:break-all;}
.hero .small{font-size:13px;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .1s;}
.tool:active{transform:scale(.97);}
.tool .ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1c2d5c,#0f1a3a);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;}
.tool b{font-size:13.5px;}
.tool span{font-size:11.5px;color:var(--muted);line-height:1.35;}
/* Inputs */
.inrow{display:flex;gap:8px;}
.inrow input,.inrow select{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none;}
.inrow input:focus{border-color:var(--accent);}
.inrow select{flex:0 0 auto;padding-right:28px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2393a0c8'><path d='M5 7l5 6 5-6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;}
.inrow button{flex:none;background:var(--accent);color:#04231d;border:none;border-radius:12px;padding:0 14px;font-weight:800;font-size:13.5px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);}
.chip:active{color:var(--text);}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
.b-ok{background:rgba(81,207,102,.15);color:var(--ok);} .b-warn{background:rgba(255,212,59,.15);color:var(--warn);} .b-bad{background:rgba(255,107,107,.15);color:var(--bad);} .b-mut{background:rgba(255,255,255,.08);color:var(--muted);}
.list{display:flex;flex-direction:column;gap:6px;}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:13px;}
.li .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all;}
.pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all;line-height:1.5;max-height:320px;overflow:auto;}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:800;margin:12px 0 6px;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kv .box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.kv .box .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.kv .box .v{font-size:14px;font-weight:700;margin-top:2px;word-break:break-all;}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px;}
.chk input{width:18px;height:18px;accent-color:var(--accent);}
/* Speed */
.gauge-wrap{display:flex;justify-content:center;}
.gauge{width:230px;max-width:100%;}
#g-arc{transition:stroke-dashoffset .25s linear;}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
.metric{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:8px;}
.metric .mh{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:6px;white-space:nowrap;}
.metric canvas{width:100%;height:50px;display:block;border-radius:6px;background:rgba(0,0,0,.2);}
.metric .mv{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:var(--muted);margin-top:5px;}
.metric .mv b{font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums;}
@media (max-width:420px){.metrics{grid-template-columns:1fr;} .metric canvas{height:40px;} .row .k{width:100px;}}
.bars{display:flex;gap:3px;align-items:flex-end;height:44px;margin-top:8px;}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.8;}
</style>
</head>
<body>
<header>
  <button class="hbtn hidden" id="back">‹ Inicio</button>
  <h1><span class="dot"></span><span id="title">Mi IP</span></h1>
  <button class="hbtn" id="theme" title="Tema">🌙</button><button class="hbtn" id="refresh">↻</button>
</header>
<main id="view"></main>
<footer>Fuentes: ipify · ipwho.is / ipapi.co · RDAP (ARIN, LACNIC, RIPE, APNIC, AFRINIC) · RIPEstat · Cloudflare DNS/Speed · OpenStreetMap. Sin registro, sin claves, sin servidores propios. Geolocalización aproximada.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
